<!DOCTYPE html>
<html>
<head>
  
    <title>OFFICER REGISTRATION FORM</title>
</head>
<body>
    <fieldset> 
         <legend>OFFICER REGISTRATION FORM</legend> 
    <form>
        <table>
        <tr>
            <td><label for="Full Name">Full Name:</label></td>
            <td><input type="text"id="fullname" name="fullname" size="36"></td>
       </tr>
        <tr>  
            <td><label for="email">Email:</label></td>
            <td><input type="email" id="email" name="email" size="36"></td>
        </tr>
        <tr>
            <td><label for="Phone Number">Phone Number:</label></td>
            <td><input type="tel" id="number" name="number" size="28"></td>
        </tr>
        <tr>
            <td><label for="Org name">Organization Name:</label></td>
            <td><input type="text" id="org name" name="org name" size="30"></td>
        </tr>
        <tr>
            <td><label for="org type">Organization Type:</label></td>
            <td><select name="org type" id="org type">
               <option value="school">SCHOOL</option>

               <option value="university">UNIVERSITY</option>
            </select>
            </td>
        </tr>
        <tr>
            <td><label for="Org address">Organization Address:</label></td>
            <td><textarea name="org address" id="org address" rows="5" cols="30"></textarea></td>
        </tr>
        <tr>
            <td><label for="password">Password:</label></td>
            <td><input type="password" id="pass" name="pass" size="20"></td>
        </tr>
        <tr>
            <td><label for="cobfirm password">Cofirm Password:</label></td>
            <td><input type="password" id="cpass" name="cpass" size="20"></td>
        </tr>
        <br>
        <tr>
            <td><label for="employeeid">Employee ID:</label></td>
            <td><input type="text" id="employeeid" name="employeeid"></td>
        </tr>

        <tr>
            <td><label for="designation">Department / Designation:</label></td>
            <td><input type="text" id="designation" name="designation"></td>
        </tr>

        <tr>
            <td><label for="document">Authorization Document:</label></td>
            <td><input type="file" id="document" name="document"></td>
        </tr>
        </table>
        <br>
        <input type="radio" id="rd" name="rd"></td>
        <label for="agreed">I agree to the term and conditions</label></td>
        <br>
        <br>
        <input type="submit" value="Submit">
        <br>
        <label for="message">APPLICATION WILL BE APPROVED BY AN ADMINISTRATOR</label>
    </form>
</fieldset>
