<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITEM OWNER REGISTRATION</title>
</head>
<body>
    <form>
        <label>Create Your Account</label>
        <br>
        <br>
    
        <label>Full Name:</label>
        <input type="text" id="fname" name="fname" placeholder="Enter Your Full Name">
        <br>
        <br>
         <label>Email Address:</label>
        <input type="email" id="email" name="email" placeholder="Enter Your Email">
        <br>
        <br>
          <label>Phone Number:</label>
        <input type="tel" id="pn" name="pn" placeholder="Enter Your Phone Number">
        <br>
        <br>
         <label>Country:</label>
         <select>
             <option value="">Select Your Country</option>
            <option value="Bangladesh">Bangladesh</option>
             <option value="India">India</option>
              <option value="Pakistan">Pakistan</option>
               <option value="Nepal">Nepal</option>

         </select>
         <br>
         <br>
         <label>City:</label>
         <input type="text" id="city" name="city" placeholder="Enter Your City">
         <br>
         <br>
           <label>Password:</label>
         <input type="password" id="pass" name="pass" placeholder="Enter Your Password">
         <br>
         <br>
             <label>Confirm Password:</label>
         <input type="password" id="conpass" name="conpass" placeholder="Confirm Your Password">
         <br>
         <br>
          <label>Profile Picture:</label>
         <input type="file" id="pp" name="pp">
         <br>
         <br>
          <label>Terms and Condition:</label>
         <input type="checkbox" id="tc" name="tc" value="yes">
         <br>
         <br>

         <input type="button" value="Create Account">
         <input type="button" value="Cancel">
         <br>
         <br>
        
    </form>
</body>
</html>
